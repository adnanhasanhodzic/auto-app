name: Build MOJ AUTO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Trajno ukloni PDF i dodaj O aplikaciji
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/components/ExpensesScreen.tsx')
          t = p.read_text()
          author_re = r'\s*<div className="text-\[11px\] text-slate-700 font-semibold mt-1">\s*Autor: Adnan Hasanhodžić\s*</div>'
          t = re.sub(author_re, '', t)
          marker = '''                <div className="text-[11px] text-slate-500 font-medium mt-0.5">\n                  Evidencija vozila, servisa, radova, troškova, goriva i održavanja.\n                </div>'''
          author = marker + '''\n                <div className="text-[11px] text-slate-700 font-semibold mt-1">\n                  Autor: Adnan Hasanhodžić\n                </div>'''
          if marker in t:
              t = t.replace(marker, author, 1)
          arrow = '''            <div className="w-8 h-8 rounded-xl bg-blue-50/70 text-[#1D68F2] flex items-center justify-center group-hover:bg-[#1D68F2] group-hover:text-white transition-colors">\n              <ChevronRight className="w-4 h-4 stroke-[2.5]" />\n            </div>\n'''
          t = t.replace(arrow, '')
          p.write_text(t)
          PY
          grep -q 'O APLIKACIJI' src/components/ExpensesScreen.tsx
          test "$(grep -o 'Autor: Adnan Hasanhodžić' src/components/ExpensesScreen.tsx | wc -l)" -eq 1
          if grep -q 'IZVOZ U PDF' src/components/ExpensesScreen.tsx; then echo 'PDF UI nije uklonjen'; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/ExpensesScreen.tsx
          git diff --cached --quiet || git commit -m 'Ensure single app author line [skip ci]'
          git push

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instaliraj dependencies
        run: npm install

      - name: Instaliraj Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7

      - name: Napravi Capacitor konfiguraciju
        run: |
          printf '%s\n' "import type { CapacitorConfig } from '@capacitor/cli';" "" "const config: CapacitorConfig = {" "  appId: 'com.mojauto.app'," "  appName: 'MOJ AUTO'," "  webDir: 'dist'" "};" "" "export default config;" > capacitor.config.ts

      - name: Build React aplikacije
        run: npm run build

      - name: Dodaj Android platformu
        run: npx cap add android

      - name: Provjeri logo
        run: test -f src/MA-LOGO.png

      - name: Instaliraj ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generiši launcher ikone
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/mipmap-anydpi
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          convert src/MA-LOGO.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert src/MA-LOGO.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert src/MA-LOGO.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert src/MA-LOGO.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert src/MA-LOGO.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp android/app/src/main/res/mipmap-$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png; done

      - name: Postavi immersive fullscreen
        run: |
          python3 -c "from pathlib import Path; p=Path('android/app/src/main/java/com/mojauto/app/MainActivity.java'); p.parent.mkdir(parents=True, exist_ok=True); p.write_text('''package com.mojauto.app;\n\nimport android.os.Bundle;\nimport android.view.View;\nimport android.view.Window;\nimport android.view.WindowManager;\nimport com.getcapacitor.BridgeActivity;\n\npublic class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        hideSystemUI();\n    }\n\n    @Override\n    public void onResume() {\n        super.onResume();\n        hideSystemUI();\n    }\n\n    @Override\n    public void onWindowFocusChanged(boolean hasFocus) {\n        super.onWindowFocusChanged(hasFocus);\n        if (hasFocus) hideSystemUI();\n    }\n\n    private void hideSystemUI() {\n        Window window = getWindow();\n        window.setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);\n        window.getDecorView().setSystemUiVisibility(\n            View.SYSTEM_UI_FLAG_FULLSCREEN |\n            View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |\n            View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |\n            View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |\n            View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |\n            View.SYSTEM_UI_FLAG_LAYOUT_STABLE\n        );\n    }\n}\n''')"

      - name: Kopiraj web aplikaciju
        run: npx cap copy android

      - name: Sinhronizuj Capacitor
        run: npx cap sync android

      - name: Postavi Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: android
        run: ./gradlew clean assembleDebug

      - name: Sačuvaj APK
        uses: actions/upload-artifact@v4
        with:
          name: MOJ-AUTO-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
