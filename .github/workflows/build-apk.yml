name: Build MOJ AUTO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Ukloni PDF opciju i postavi O aplikaciji
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/ExpensesScreen.tsx')
          if p.exists():
              t = p.read_text(encoding='utf-8')
              t = re.sub(r'\n\s*// PDF Export state.*?(?=\n\s*// Services filtered)', '\n', t, flags=re.S)
              t = re.sub(r'\n\s*// Sync pdfYear.*?(?=\n\s*// Services filtered)', '\n', t, flags=re.S)
              t = re.sub(r'\n\s*// PDF category options.*?(?=\n\s*// Generate and print PDF report)', '\n', t, flags=re.S)
              t = re.sub(r'\n\s*// Generate and print PDF report.*?(?=\n\s*return \()', '\n', t, flags=re.S)
              t = re.sub(r'\n\s*<[^>]*>[^<]*IZVOZ U PDF.*?</[^>]*>', '', t, flags=re.S)
              t = t.replace('Izvoz u PDF', 'O aplikaciji')
              t = t.replace('IZVOZ U PDF', 'O APLIKACIJI')
              if 'Autor: Adnan Hasanhodžić' not in t:
                  t = t.replace(
                      'Evidencija vozila, servisa, radova, troškova, goriva i održavanja.',
                      'Evidencija vozila, servisa, radova, troškova, goriva i održavanja.\n                </div>\n                <div className="text-[11px] text-slate-700 font-semibold mt-1">\n                  Autor: Adnan Hasanhodžić',
                      1,
                  )
              t = t.replace('Evidencija vozila, servisa, radova, troškova, goriva i održavanja.\n                </div>\n                </div>', 'Evidencija vozila, servisa, radova, troškova, goriva i održavanja.\n                </div>')
              p.write_text(t, encoding='utf-8')

          # Fix duplicate textual plus without assuming a specific modal path.
          for candidate in [
              Path('src/components/RegularServiceModal.tsx'),
              Path('src/components/service/ServiceEntryFormView.tsx'),
          ]:
              if candidate.exists():
                  s = candidate.read_text(encoding='utf-8')
                  s = s.replace('<span>+ Dodaj stavku</span>', '<span>Dodaj stavku</span>')
                  candidate.write_text(s, encoding='utf-8')
          PY

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instaliraj dependencies
        run: npm install

      - name: Instaliraj Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7

      - name: Napravi Capacitor konfiguraciju
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.mojauto.app',
            appName: 'MOJ AUTO',
            webDir: 'dist'
          };

          export default config;
          EOF

      - name: Build React aplikacije
        run: npm run build

      - name: Dodaj Android platformu
        run: npx cap add android

      - name: Provjeri logo
        run: test -f src/MA-LOGO.png

      - name: Instaliraj ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generiši launcher ikone
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/mipmap-anydpi
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          convert src/MA-LOGO.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert src/MA-LOGO.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert src/MA-LOGO.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert src/MA-LOGO.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert src/MA-LOGO.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp android/app/src/main/res/mipmap-$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png; done

      - name: Postavi immersive fullscreen
        run: |
          mkdir -p android/app/src/main/java/com/mojauto/app
          cat > android/app/src/main/java/com/mojauto/app/MainActivity.java <<'EOF'
          package com.mojauto.app;

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  hideSystemUI();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  hideSystemUI();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemUI();
              }

              private void hideSystemUI() {
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );
              }
          }
          EOF

      - name: Kopiraj web aplikaciju
        run: npx cap copy android

      - name: Sinhronizuj Capacitor
        run: npx cap sync android

      - name: Postavi Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: android
        run: ./gradlew clean assembleDebug

      - name: Sačuvaj APK
        uses: actions/upload-artifact@v4
        with:
          name: MOJ-AUTO-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
