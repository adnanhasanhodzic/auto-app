name: Build MOJ AUTO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instaliraj dependencies
        run: npm install

      - name: Instaliraj Capacitor i PDF podršku
        run: |
          npm install @capacitor/core@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7 html2pdf.js
          npm install --save-dev @capacitor/cli@7

      - name: Napravi Capacitor konfiguraciju
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.mojauto.app',
            appName: 'MOJ AUTO',
            webDir: 'dist'
          };
          export default config;
          EOF

      - name: Provjeri MA-LOGO.png
        run: |
          test -f src/MA-LOGO.png
          echo "MA-LOGO.png pronađen"
          ls -lh src/MA-LOGO.png

      - name: Patch PDF export za Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/ExpensesScreen.tsx')
          text = p.read_text()

          imports = """import { Capacitor } from '@capacitor/core';
          import { Filesystem, Directory } from '@capacitor/filesystem';
          import { Share } from '@capacitor/share';
          import html2pdf from 'html2pdf.js';
          import appLogo from '../MA-LOGO.png';
          """
          anchor = "import { getDateTimestamp, parseCustomDate } from '../utils/dateUtils';\n"
          if "from '@capacitor/filesystem'" not in text:
              text = text.replace(anchor, anchor + imports, 1)

          text = text.replace(
              'const handlePrintPdf = () => {',
              'const handlePrintPdf = async () => {',
              1
          )

          old_logo = '            <div class=\\"logo-badge\\">🚗</div>'
          new_logo = '            <div class=\\"logo-badge\\"><img src=\\"${appLogo}\\" style=\\"width:38px;height:38px;object-fit:contain;border-radius:10px;\\" /></div>'
          if old_logo in text:
              text = text.replace(old_logo, new_logo, 1)

          start_marker = "    const printWindow = window.open('', '_blank');"
          end_marker = "    setIsPdfModalOpen(false);\n  };"
          start = text.find(start_marker)
          if start == -1:
              raise RuntimeError('PDF window.open blok nije pronađen.')
          end = text.find(end_marker, start)
          if end == -1:
              raise RuntimeError('Kraj PDF export funkcije nije pronađen.')
          end += len(end_marker)

          replacement = r'''    try {
      const pdfElement = document.createElement('div');
      pdfElement.innerHTML = htmlContent;
      const bodyElement = pdfElement.querySelector('body') as HTMLElement | null;
      if (!bodyElement) throw new Error('PDF sadržaj nije moguće pripremiti.');

      bodyElement.style.width = '794px';
      bodyElement.style.background = '#FFFFFF';
      bodyElement.style.margin = '0';
      bodyElement.style.padding = '0';
      document.body.appendChild(bodyElement);

      try {
        const filename = `MOJ_AUTO_${car.make}_${car.model}_${pdfYear}.pdf`.replace(/[^a-zA-Z0-9._-]+/g, '_');
        const worker = html2pdf()
          .set({
            margin: [15, 15, 15, 15],
            filename,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, backgroundColor: '#FFFFFF' },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['css', 'legacy'] },
          })
          .from(bodyElement)
          .toPdf();

        const pdfBlob = await worker.output('blob');

        if (Capacitor.isNativePlatform()) {
          const base64 = await new Promise<string>((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => {
              const result = String(reader.result || '');
              const comma = result.indexOf(',');
              resolve(comma >= 0 ? result.substring(comma + 1) : result);
            };
            reader.onerror = () => reject(reader.error || new Error('Čitanje PDF fajla nije uspjelo.'));
            reader.readAsDataURL(pdfBlob);
          });

          const saved = await Filesystem.writeFile({
            path: filename,
            data: base64,
            directory: Directory.Cache,
            recursive: true,
          });

          await Share.share({
            title: 'MOJ AUTO – PDF izvještaj',
            text: `Izvještaj troškova za ${car.make} ${car.model}`,
            files: [saved.uri],
            dialogTitle: 'Otvori PDF pomoću',
          });
        } else {
          const url = URL.createObjectURL(pdfBlob);
          const link = document.createElement('a');
          link.href = url;
          link.download = filename;
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        setIsPdfModalOpen(false);
      } finally {
        bodyElement.remove();
      }
    } catch (error) {
      console.error('PDF export failed:', error);
      alert('PDF nije moguće otvoriti na ovom telefonu. Izvještaj nije izgubljen.');
      setIsPdfModalOpen(false);
    }
  };'''

          text = text[:start] + replacement + text[end:]
          p.write_text(text)
          print('Android PDF export patched: nema window.open/window.print; koristi Filesystem + Share.')
          PY

      - name: Build React aplikacije
        run: npm run build

      - name: Dodaj Android platformu
        run: npx cap add android

      - name: Instaliraj ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Ukloni Capacitor default adaptive ikone
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -rf android/app/src/main/res/mipmap-anydpi
          rm -rf android/app/src/main/res/mipmap-anydpi-v24
          rm -rf android/app/src/main/res/mipmap-anydpi-v21

      - name: Generiši launcher ikone iz MA-LOGO.png
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          convert src/MA-LOGO.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert src/MA-LOGO.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert src/MA-LOGO.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert src/MA-LOGO.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert src/MA-LOGO.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Postavi MA-LOGO kao launcher ikonu
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          start = text.find('<application')
          if start < 0:
              raise RuntimeError('AndroidManifest.xml nema application element.')
          end = text.find('>', start)
          if end < 0:
              raise RuntimeError('Application tag nije ispravno zatvoren.')
          tag = text[start:end + 1]
          tag = re.sub(r'\s+android:icon="[^"]*"', '', tag)
          tag = re.sub(r'\s+android:roundIcon="[^"]*"', '', tag)
          tag = tag.replace('<application', '<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"', 1)
          manifest.write_text(text[:start] + tag + text[end + 1:])
          print('Launcher ikona postavljena na MA-LOGO.png')
          PY

      - name: Postavi immersive fullscreen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/com/mojauto/app/MainActivity.java')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text('''package com.mojauto.app;

          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  applyImmersiveMode();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  applyImmersiveMode();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) applyImmersiveMode();
              }

              private void applyImmersiveMode() {
                  Window window = getWindow();
                  window.setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  window.setDecorFitsSystemWindows(false);

                  View decor = window.getDecorView();
                  decor.setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );

                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.R) {
                      WindowInsetsController controller = window.getInsetsController();
                      if (controller != null) {
                          controller.setSystemBarsBehavior(
                              WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          );
                          controller.hide(
                              WindowInsets.Type.statusBars()
                                  | WindowInsets.Type.navigationBars()
                          );
                      }
                  }
              }
          }
          ''')
          PY

      - name: Kopiraj web aplikaciju u Android
        run: npx cap copy android

      - name: Sinhronizuj Capacitor
        run: npx cap sync android

      - name: Postavi Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: android
        run: ./gradlew clean assembleDebug

      - name: Sačuvaj APK
        uses: actions/upload-artifact@v4
        with:
          name: MOJ-AUTO-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk