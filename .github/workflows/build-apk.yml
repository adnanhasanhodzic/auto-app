name: Build MOJ AUTO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instaliraj dependencies
        run: npm install

      - name: Instaliraj Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7

      - name: Napravi Capacitor konfiguraciju
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.mojauto.app',
            appName: 'MOJ AUTO',
            webDir: 'dist'
          };

          export default config;
          EOF

      - name: Build React aplikacije
        run: npm run build

      - name: Dodaj Android platformu
        run: npx cap add android

      # ---------------------------------------------------------
      # LOGO
      # ---------------------------------------------------------

      - name: Provjeri logo
        run: |
          test -f src/MA-LOGO.png
          file src/MA-LOGO.png

      - name: Instaliraj ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generiši Android launcher ikone
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          convert src/MA-LOGO.png -resize 48x48 \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png

          convert src/MA-LOGO.png -resize 72x72 \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png

          convert src/MA-LOGO.png -resize 96x96 \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          convert src/MA-LOGO.png -resize 144x144 \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          convert src/MA-LOGO.png -resize 192x192 \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png

          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png

          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
             android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Postavi launcher ikonu
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          text = text.replace(
              '<application',
              '<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"',
              1
          )

          manifest.write_text(text)
          PY

      # ---------------------------------------------------------
      # PRAVI IMMERSIVE FULLSCREEN
      # ---------------------------------------------------------

      - name: Postavi immersive fullscreen
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_activity = Path(
              "android/app/src/main/java/com/mojauto/app/MainActivity.java"
          )

          main_activity.parent.mkdir(parents=True, exist_ok=True)

          main_activity.write_text("""\
          package com.mojauto.app;

          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;

          import com.capacitorjs.plugins.statusbar.StatusBarPlugin;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  hideSystemUI();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);

                  if (hasFocus) {
                      hideSystemUI();
                  }
              }

              private void hideSystemUI() {
                  Window window = getWindow();

                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.R) {

                      window.setDecorFitsSystemWindows(false);

                      WindowInsetsController controller =
                          window.getInsetsController();

                      if (controller != null) {

                          controller.hide(
                              WindowInsets.Type.statusBars()
                                  | WindowInsets.Type.navigationBars()
                          );

                          controller.setSystemBarsBehavior(
                              WindowInsetsController
                                  .BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          );
                      }

                  } else {

                      window.getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      );
                  }
              }
          }
          """)

          print("True immersive fullscreen configured.")
          PY

      - name: Kopiraj web aplikaciju u Android
        run: npx cap copy android

      - name: Sinhronizuj Capacitor
        run: npx cap sync android

      - name: Postavi Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Sačuvaj APK
        uses: actions/upload-artifact@v4
        with:
          name: MOJ-AUTO-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
