name: Build MOJ AUTO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instaliraj dependencies
        run: npm install

      - name: Instaliraj Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7
          npm install --save-dev @capacitor/assets

      - name: Napravi Capacitor konfiguraciju
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.mojauto.app',
            appName: 'MOJ AUTO',
            webDir: 'dist',
            bundledWebRuntime: false
          };

          export default config;
          EOF

      - name: Build React aplikacije
        run: npm run build

      - name: Dodaj Android platformu
        run: npx cap add android

      - name: Pripremi logo
        run: |
          mkdir -p resources
          cp src/MA-LOGO.png resources/icon.png

      - name: Generiši Android ikone
        run: npx capacitor-assets generate --android

      - name: Kopiraj web aplikaciju u Android
        run: npx cap copy android

      - name: Sinhronizuj Capacitor
        run: npx cap sync android

      - name: Postavi fullscreen Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_activity = Path(
              "android/app/src/main/java/com/mojauto/app/MainActivity.java"
          )

          main_activity.parent.mkdir(parents=True, exist_ok=True)

          main_activity.write_text("""\
          package com.mojauto.app;

          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();

                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.R) {
                      WindowInsetsController controller = window.getInsetsController();

                      if (controller != null) {
                          controller.hide(
                              WindowInsets.Type.statusBars()
                                  | WindowInsets.Type.navigationBars()
                          );

                          controller.setSystemBarsBehavior(
                              WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          );
                      }

                      window.setDecorFitsSystemWindows(false);
                  } else {
                      window.getDecorView().setSystemUiVisibility(
                          android.view.View.SYSTEM_UI_FLAG_FULLSCREEN
                              | android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              | android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              | android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              | android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      );
                  }
              }
          }
          """)

          print("Fullscreen MainActivity created.")
          PY

      - name: Postavi Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Sačuvaj APK
        uses: actions/upload-artifact@v4
        with:
          name: MOJ-AUTO-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
