Ran 7 commands, read memory, and 3 more tools
Pronašao sam uzrok. Nije stvar u ključu unutar same aplikacije nego u tome čime GitHub Actions potpisuje APK pri svakom pokretanju workflow-a.

Uzrok: Workflow gradi APK sa ./gradlew clean assembleDebug. Debug build tip se potpisuje takozvanim debug keystore-om koji se automatski generiše na ~/.android/debug.keystore — ali GitHub Actions runner je svaki put potpuno svježa mašina, taj fajl ne postoji unaprijed pa se generiše iznova, sa nasumičnim ključem, u svakom build-u. Android tretira APK potpisan drugim ključem kao drugu aplikaciju, čak i kad je applicationId (com.mojauto.app) isti — zato ti sistem traži deinstalaciju umjesto update-a, i baza/podaci iz stare instalacije se gube.

Rješenje: generisati taj debug keystore jednom, sačuvati ga kao GitHub secret, i u workflow-u ga vraćati na isto mjesto prije svakog build-a. Onda je ključ uvijek isti, i svaki naredni APK je "update" postojeće instalacije.

Generisao sam ti taj keystore (sa standardnim Android debug kredencijalima) i već sam ubacio odgovarajući korak u workflow fajl.

