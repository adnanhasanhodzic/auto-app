name: Build MOJ AUTO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instaliraj dependencies
        run: npm install

      - name: Instaliraj Capacitor i native PDF podršku
        run: |
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7
          npm install @capacitor/filesystem@7 @capacitor-community/file-opener@7 html2pdf.js@0.14.0

      - name: Napravi Capacitor konfiguraciju
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.mojauto.app',
            appName: 'MOJ AUTO',
            webDir: 'dist'
          };
          export default config;
          EOF

      - name: Dodaj Android platformu
        run: npx cap add android

      # =========================================================
      # PDF EXPORT - NATIVE ANDROID PDF OPENER
      # =========================================================

      - name: Ispravi PDF export za Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/ExpensesScreen.tsx')
          text = path.read_text()

          # Native PDF imports
          marker = "import { getDateTimestamp, parseCustomDate } from '../utils/dateUtils';"
          imports = marker + "\nimport MA_LOGO from '../MA-LOGO.png';\nimport html2pdf from 'html2pdf.js';\nimport { Filesystem, Directory } from '@capacitor/filesystem';\nimport { FileOpener } from '@capacitor-community/file-opener';"
          if "@capacitor-community/file-opener" not in text:
              if marker not in text:
                  raise RuntimeError('Import marker u ExpensesScreen.tsx nije pronađen.')
              text = text.replace(marker, imports, 1)

          # The export must be asynchronous because the PDF is generated,
          # written to native storage and then opened by Android.
          text = text.replace(
              "const handlePrintPdf = () => {",
              "const handlePrintPdf = async () => {",
              1
          )

          # Use the real application logo in the generated report.
          text = text.replace(
              '<div class="logo-badge">🚗</div>',
              '<img class="logo-badge" src="${MA_LOGO}" alt="MOJ AUTO" />',
              1
          )

          old_css = '''          .logo-badge {
            width: 38px;
            height: 38px;
            background: #1D68F2;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            font-weight: 900;
            font-size: 18px;
          }'''

          new_css = '''          .logo-badge {
            width: 38px;
            height: 38px;
            object-fit: contain;
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 10px;
            padding: 4px;
            display: block;
          }'''

          if old_css in text:
              text = text.replace(old_css, new_css, 1)

          # Replace only the old popup/print mechanism. The existing HTML report
          # remains intact; it is rendered to a real PDF instead of a WebView popup.
          old_block = re.compile(
              r'''    const printWindow = window\.open\('', '_blank'\);\n'''
              r'''    if \(!printWindow\) \{\n'''
              r'''      alert\('Molimo omogućite skočni prozor \(pop-up\) za štampanje / preuzimanje PDF izvještaja\.'\);\n'''
              r'''      return;\n'''
              r'''    \}\n''',
              re.MULTILINE
          )

          new_block = '''    const reportFileName = `MOJ-AUTO-${pdfYear}-${pdfScope}.pdf`;

    try {
      const pdfContainer = document.createElement('div');
      pdfContainer.innerHTML = htmlContent;
      pdfContainer.style.position = 'fixed';
      pdfContainer.style.left = '-100000px';
      pdfContainer.style.top = '0';
      pdfContainer.style.width = '794px';
      pdfContainer.style.background = '#FFFFFF';
      pdfContainer.style.zIndex = '-1';
      document.body.appendChild(pdfContainer);

      // Wait for the real MA-LOGO.png image to finish loading before rendering.
      const logoImage = pdfContainer.querySelector('.logo-badge') as HTMLImageElement | null;
      if (logoImage && !logoImage.complete) {
        await new Promise<void>((resolve) => {
          logoImage.onload = () => resolve();
          logoImage.onerror = () => resolve();
        });
      }

      const pdfBlob = await html2pdf()
        .set({
          margin: 0,
          filename: reportFileName,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: {
            scale: 2,
            useCORS: true,
            backgroundColor: '#FFFFFF',
            scrollX: 0,
            scrollY: 0,
            logging: false,
          },
          jsPDF: {
            unit: 'mm',
            format: 'a4',
            orientation: 'portrait',
          },
          pagebreak: { mode: ['css', 'legacy'] },
        })
        .from(pdfContainer)
        .outputPdf('blob');

      document.body.removeChild(pdfContainer);

      const arrayBuffer = await pdfBlob.arrayBuffer();
      const bytes = new Uint8Array(arrayBuffer);
      let binary = '';
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
      }
      const base64Data = btoa(binary);

      await Filesystem.writeFile({
        path: reportFileName,
        data: base64Data,
        directory: Directory.Cache,
      });

      const { uri } = await Filesystem.getUri({
        path: reportFileName,
        directory: Directory.Cache,
      });

      setIsPdfModalOpen(false);

      // IMPORTANT: hand the PDF to Android's native file handler.
      // This opens the installed/default PDF application, not the MOJ AUTO WebView.
      await FileOpener.open({
        filePath: uri,
        contentType: 'application/pdf',
        openWithDefault: true,
      });
    } catch (error) {
      console.error('PDF export error:', error);
      alert('Nije moguće otvoriti PDF. Provjerite da li na telefonu postoji aplikacija za otvaranje PDF datoteka.');
    }
'''

          if not old_block.search(text):
              raise RuntimeError('Stari window.open PDF blok nije pronađen.')
          text = old_block.sub(new_block, text, count=1)

          old_tail = '''    printWindow.document.open();
    printWindow.document.write(htmlContent);
    printWindow.document.close();
    setIsPdfModalOpen(false);'''

          if old_tail in text:
              text = text.replace(old_tail, '', 1)
          else:
              raise RuntimeError('Stari printWindow završni blok nije pronađen.')

          path.write_text(text)
          print('PDF export patched: native Filesystem + FileOpener + html2pdf.js')
          PY

      # =========================================================
      # MA-LOGO.png = IKONA INSTALIRANE APLIKACIJE
      # Ne mijenja logo niti sliku unutar React GUI-ja.
      # =========================================================

      - name: Provjeri MA-LOGO.png
        run: |
          test -f src/MA-LOGO.png
          echo "MA-LOGO.png pronađen"
          ls -lh src/MA-LOGO.png
          file src/MA-LOGO.png

      - name: Instaliraj ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Ukloni Capacitor default adaptive ikone
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -rf android/app/src/main/res/mipmap-anydpi
          rm -rf android/app/src/main/res/mipmap-anydpi-v24
          rm -rf android/app/src/main/res/mipmap-anydpi-v21

      - name: Generiši launcher ikone iz MA-LOGO.png
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          convert src/MA-LOGO.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert src/MA-LOGO.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert src/MA-LOGO.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert src/MA-LOGO.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert src/MA-LOGO.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Postavi MA-LOGO kao launcher ikonu
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()

          start = text.find('<application')
          if start == -1:
              raise RuntimeError('AndroidManifest.xml nema application element.')

          end = text.find('>', start)
          if end == -1:
              raise RuntimeError('application element nije ispravno zatvoren.')

          tag = text[start:end + 1]
          tag = re.sub(r'\s+android:icon="[^"]*"', '', tag)
          tag = re.sub(r'\s+android:roundIcon="[^"]*"', '', tag)
          tag = tag.replace(
              '<application',
              '<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"',
              1
          )

          text = text[:start] + tag + text[end + 1:]
          manifest.write_text(text)

          print('MA-LOGO.png -> @mipmap/ic_launcher')
          PY

          grep -n '<application' android/app/src/main/AndroidManifest.xml

      # =========================================================
      # PRAVI IMMERSIVE FULLSCREEN
      # =========================================================

      - name: Postavi pravi fullscreen - bez sata, mreže i baterije
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_activity = Path('android/app/src/main/java/com/mojauto/app/MainActivity.java')
          main_activity.parent.mkdir(parents=True, exist_ok=True)

          main_activity.write_text(r'''package com.mojauto.app;

          import android.os.Bundle;
          import android.os.Handler;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private final Handler fullscreenHandler = new Handler();

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );
                  super.onCreate(savedInstanceState);
                  hideSystemBars();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  hideSystemBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemBars();
                      fullscreenHandler.postDelayed(this::hideSystemBars, 250);
                  }
              }

              private void hideSystemBars() {
                  Window window = getWindow();

                  window.setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );

                  View decorView = window.getDecorView();

                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.R) {
                      window.setDecorFitsSystemWindows(false);

                      WindowInsetsController controller = window.getInsetsController();

                      if (controller != null) {
                          controller.setSystemBarsBehavior(
                              WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          );
                          controller.hide(WindowInsets.Type.systemBars());
                      }
                  } else {
                      decorView.setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      );
                  }
              }
          }
          ''')

          print('TRUE IMMERSIVE FULLSCREEN configured.')
          print('Status bar: HIDDEN')
          print('Navigation bar: HIDDEN')
          PY

      - name: Build React aplikacije
        run: npm run build

      - name: Kopiraj web aplikaciju u Android
        run: npx cap copy android

      - name: Sinhronizuj Capacitor
        run: npx cap sync android

      - name: Postavi Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: android
        run: ./gradlew clean assembleDebug

      - name: Sačuvaj APK
        uses: actions/upload-artifact@v4
        with:
          name: MOJ-AUTO-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
