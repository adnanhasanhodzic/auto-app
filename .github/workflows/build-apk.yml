name: Build MOJ AUTO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instaliraj dependencies
        run: npm install

      - name: Instaliraj Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7

      - name: Napravi Capacitor konfiguraciju
        run: |
          cat > capacitor.config.ts <<'EOF'
import type { CapacitorConfig } from '@capacitor/cli';

const config: CapacitorConfig = {
  appId: 'com.mojauto.app',
  appName: 'MOJ AUTO',
  webDir: 'dist'
};

export default config;
EOF

      - name: Ukloni PDF iz Troškova i dodaj O aplikaciji
        run: |
          echo 'ZnJvbSBwYXRobGliIGltcG9ydCBQYXRoCnA9UGF0aCgic3JjL2NvbXBvbmVudHMvRXhwZW5zZXNTY3JlZW4udHN4IilcdG4KdD1wLnJlYWRfdGV4dCgpXG50PXQucmVwbGFjZSgiICBGaWxlRG93biwifCIsICIiKS5yZXBsYWNlKCIgIFByaW50ZXIsXG4iLCAiIikucmVwbGFjZSgiICBGaWxlVGV4dCxcbiIsICIiKVxu' | base64 -d > /tmp/update_expenses.py
          cat >> /tmp/update_expenses.py <<'PY'
start=t.find("  // PDF Export state")
end=t.find("  // Services filtered by active vehicle and selected year")
if start != -1 and end != -1: t=t[:start]+t[end:]
start=t.find("  // PDF category options for the selected pdfYear")
end=t.find("  return (", start)
if start != -1 and end != -1: t=t[:start]+t[end:]
start=t.find("      {/* FIKSNI DONJI BLOK: IZVOZ U PDF")
end=t.find("    </div>\\n  );", start)
if start == -1 or end == -1: raise SystemExit("PDF UI block nije pronađen")
about='''      {!selectedCategoryDetail && (
        <div className="flex-shrink-0 z-20 bg-[#F8FAFC] px-5 py-3 border-t border-slate-200/70">
          <div className="w-full p-4 rounded-2xl bg-white border border-slate-200/90 shadow-2xs flex items-center space-x-3">
            <img src="/MA-LOGO.png" alt="MOJ AUTO" className="w-11 h-11 rounded-xl object-contain flex-shrink-0" />
            <div className="min-w-0">
              <div className="text-xs font-bold text-slate-900 uppercase tracking-wider">O APLIKACIJI</div>
              <div className="text-[11px] text-slate-500 font-medium mt-0.5 leading-relaxed">MOJ AUTO – jednostavna evidencija vozila, servisa, radova, troškova, goriva, garancija i održavanja.</div>
              <div className="text-[11px] text-slate-400 font-semibold mt-1">Autor: Adnan Hasanhodzic</div>
            </div>
          </div>
        </div>
      )}

'''
t=t[:start]+about+t[end:]
p.write_text(t)
print("PDF uklonjen iz Troškova; dodano O aplikaciji.")
PY
          python3 /tmp/update_expenses.py

      - name: Build React aplikacije
        run: npm run build

      - name: Dodaj Android platformu
        run: npx cap add android

      - name: Provjeri logo
        run: test -f src/MA-LOGO.png

      - name: Instaliraj ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generiši launcher ikone
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/mipmap-anydpi
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          convert src/MA-LOGO.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert src/MA-LOGO.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert src/MA-LOGO.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert src/MA-LOGO.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert src/MA-LOGO.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp android/app/src/main/res/mipmap-$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png; done

      - name: Postavi AndroidManifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET" />
    <application
        android:allowBackup="true"
        android:icon="@mipmap/ic_launcher"
        android:label="MOJ AUTO"
        android:roundIcon="@mipmap/ic_launcher"
        android:supportsRtl="true"
        android:theme="@style/AppTheme">
        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:launchMode="singleTask"
            android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
            android:theme="@style/AppTheme">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
EOF

      - name: Postavi immersive fullscreen
        run: |
          cat > android/app/src/main/java/com/mojauto/app/MainActivity.java <<'EOF'
package com.mojauto.app;

import android.os.Bundle;
import android.view.View;
import android.view.Window;
import android.view.WindowManager;
import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {
    @Override
    public void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        hideSystemUI();
    }

    @Override
    public void onResume() {
        super.onResume();
        hideSystemUI();
    }

    @Override
    public void onWindowFocusChanged(boolean hasFocus) {
        super.onWindowFocusChanged(hasFocus);
        if (hasFocus) {
            hideSystemUI();
        }
    }

    private void hideSystemUI() {
        Window window = getWindow();
        window.setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
        View decorView = window.getDecorView();
        decorView.setSystemUiVisibility(
            View.SYSTEM_UI_FLAG_FULLSCREEN
            | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
            | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
            | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
            | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
            | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
        );
    }
}
EOF

      - name: Kopiraj web aplikaciju
        run: npx cap copy android

      - name: Sinhronizuj Capacitor
        run: npx cap sync android

      - name: Postavi Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: android
        run: ./gradlew clean assembleDebug

      - name: Sačuvaj APK
        uses: actions/upload-artifact@v4
        with:
          name: MOJ-AUTO-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
