name: Apply empty mileage field patch

on:
  push:
    paths:
      - '.github/workflows/patch-empty-mileage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make new service mileage empty
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/service/ServiceEntryFormView.tsx')
          s = p.read_text()
          old = "existingRecord?.mileage !== undefined ? existingRecord.mileage : (car.mileage || 0)"
          new = "existingRecord?.mileage !== undefined ? existingRecord.mileage : 0"
          if old not in s:
              raise SystemExit('Expected mileage initializer not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/service/ServiceEntryFormView.tsx
          git rm .github/workflows/patch-empty-mileage.yml
          git commit -m "Start new service records with empty mileage"
          git push
